name: KVSocial GHCR release

on:
  push:
    tags:
      - "v*-kvs.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: github.repository == 'KVSocial/listmonk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a release from kvs-main
        run: |
          git fetch origin kvs-main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/kvs-main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            frontend/yarn.lock
            frontend/email-builder/yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Run tests
        run: go test ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check --config .goreleaser-kvs.yml

      - name: Build and publish KVSocial image
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --parallelism 1 --clean --config .goreleaser-kvs.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
