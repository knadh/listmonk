components:
  schemas:
    LanguagePack:
      type: object
      properties:
        data:
          type: object
          description: Translation keys and localized strings. See i18n/en.json for the current keys.
          additionalProperties:
            type: string
          properties:
            _.code:
              type: string
            _.name:
              type: string

    ServerConfig:
      type: object
      properties:
        data:
          type: object
          properties:
            messengers:
              type: array
              items:
                type: string
            langs:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  name:
                    type: string
            lang:
              type: string
            update:
              type: string
            needs_restart:
              type: boolean
            version:
              type: string

    DashboardChart:
      type: object
      properties:
        link_clicks:
          type: array
          items:
            type: object
            properties:
              count:
                type: integer
              date:
                type: string
        campaign_views:
          type: array
          items:
            type: object
            properties:
              count:
                type: integer
              date:
                type: string

    DashboardCount:
      type: object
      properties:
        data:
          type: object
          properties:
            subscribers:
              type: object
              properties:
                total:
                  type: integer
                blocklisted:
                  type: object
                orphans:
                  type: integer
            lists:
              type: object
              properties:
                total:
                  type: integer
                private:
                  type: integer
                public:
                  type: integer
                optin_single:
                  type: integer
                optin_double:
                  type: integer
            campaigns:
              type: object
              properties:
                total:
                  type: integer
                by_status:
                  type: object
                  properties:
                    draft:
                      type: integer
            messages:
              type: integer

    SMTPSettings:
      type: object
      properties:
        uuid:
          type: string
        enabled:
          type: boolean
        host:
          type: string
        hello_hostname:
          type: string
        port:
          type: integer
        auth_protocol:
          type: string
        username:
          type: string
        email_headers:
          type: array
          items:
            type: object
        max_conns:
          type: integer
        max_msg_retries:
          type: integer
        idle_timeout:
          type: string
        wait_timeout:
          type: string
        tls_type:
          type: string
        tls_skip_verify:
          type: boolean

    SMTPTest:
      type: object
      properties:
        uuid:
          type: string
        enabled:
          type: boolean
        host:
          type: string
        hello_hostname:
          type: string
        port:
          type: integer
        auth_protocol:
          type: string
        username:
          type: string
        email_headers:
          type: array
          items:
            type: object
        max_conns:
          type: integer
        max_msg_retries:
          type: integer
        idle_timeout:
          type: string
        wait_timeout:
          type: string
        tls_type:
          type: string
        tls_skip_verify:
          type: boolean
        strEmailHeaders:
          type: string
        password:
          type: string
        email:
          type: string

    MailBoxBounces:
      type: object
      properties:
        uuid:
          type: string
        enabled:
          type: boolean
        type:
          type: string
        host:
          type: string
        port:
          type: integer
        auth_protocol:
          type: string
        return_path:
          type: string
        username:
          type: string
        tls_enabled:
          type: boolean
        tls_skip_verify:
          type: boolean
        scan_interval:
          type: string

    Settings:
      type: object
      properties:
        app.site_name:
          type: string
        app.root_url:
          type: string
        app.logo_url:
          type: string
        app.favicon_url:
          type: string
        app.from_email:
          type: array
          description: Sender addresses. The first must be a literal email address and is the default for campaigns and system emails.
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 2000
        app.notify_emails:
          type: array
          items:
            type: string
        app.enable_public_subscription_page:
          type: boolean
        app.enable_public_archive:
          type: boolean
        app.send_optin_confirmation:
          type: boolean
