{{ define "admin-login-setup" }}
{{ template "admin-public-header" .}}

<section>
	<h4 class="page-title">{{ .L.T "users.newUser"}}</h4>
	<p> {{ .L.T "users.firstTime" }}</p>

	<form method="post" action="">
		<input type="hidden" name="nonce" value="{{ .Data.Nonce }}" />
		<input type="hidden" name="next" value="{{ .Data.NextURI }}" />
		<div data-field>
			<label for="email">{{ .L.T "globals.fields.email" }}</label>
			<input id="email" type="email" name="email" autofocus required minlength="3" />
		</div>
		<div data-field>
			<label for="username">{{ .L.T "globals.fields.username" }}</label>
			<input id="username" type="text" name="username" required minlength="3" />
		</div>
		<div data-field>
			<label for="password">{{ .L.T "globals.fields.password" }}</label>
			<input id="password" type="password" name="password" required minlength="8" />
		</div>
		<div data-field>
			<label for="password2">{{ .L.T "globals.fields.passwordRepeat" }}</label>
			<input id="password2" type="password" name="password2" required minlength="8" />
		</div>

		{{ if .Data.Error }}<div role="alert" data-variant="danger" class="mb-4">{{ .Data.Error }}</div>{{ end }}

		<button class="w-100" type="submit">{{ .L.T "globals.buttons.continue" }}</button>
	</form>
</section>

{{ template "admin-public-footer" .}}
{{ end }}
