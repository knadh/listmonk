{{ define "admin-forgot-password" }}
{{ template "admin-public-header" .}}

<section>
	<h4 class="page-title">{{ .L.T "users.forgotPassword"}}</h4>

	<form method="post" action="{{ .RootURL }}/admin/forgot">
		<div data-field>
			<label for="email">{{ .L.T "globals.fields.email" }}</label>
			<input id="email" type="email" name="email" autofocus required />
		</div>

		{{ if .Data.Error }}<div role="alert" data-variant="danger" class="mb-4">{{ .Data.Error }}</div>{{ end }}

		<button class="w-100" type="submit">{{ .L.T "globals.buttons.continue" }}</button>
		<p class="mt-4"><a href="{{ .RootURL }}/admin/login">&larr; {{ .L.T "globals.buttons.login" }}</a></p>
	</form>
</section>

{{ template "admin-public-footer" .}}
{{ end }}
