{{ define "campaign-preview" -}}
{{- $canManage := .Data.Can "campaigns:manage" "campaigns:manage_all" -}}
<dialog class="preview-modal" x-ref="previewDialog" @close="onPreviewClose">
	<div class="dialog-card">
		<header class="dialog-head hstack justify-between">
			<h4 class="dialog-title" x-text="preview.title"></h4>
		</header>
		<section class="dialog-body preview" :aria-busy="preview.loading">
			<form method="post" x-ref="previewForm" :action="preview.url" target="campaign-preview-frame">
				<input type="hidden" name="template_id" :value="preview.templateID" />
				<input type="hidden" name="content_type" :value="preview.contentType" />
				<input type="hidden" name="archive_meta" :value="preview.archiveMeta" />
				<input type="hidden" name="body" :value="preview.body" />
			</form>
			<iframe id="iframe" name="campaign-preview-frame" x-ref="previewFrame" title="{{ .L.T "campaigns.preview" }}" @load="preview.loading = false"></iframe>
		</section>
		<footer class="dialog-foot">
			<div class="row">
				<div class="col-6 hstack">
					{{- if $canManage }}
						<ot-dropdown>
							<button type="button" class="outline campaign-test-btn dot-indicator" :class="{ 'is-active': form.testEmails.length > 0 }" popovertarget="campaign-test" :disabled="isNew" data-cy="btn-test">{{ Icon "mail" }} {{ .L.T "campaigns.sendTest" }}</button>
							<div popover id="campaign-test" class="campaign-test">
								<label data-field>
									<ot-taginput x-model="form.testEmails"><input type="email" placeholder="{{ .L.T "campaigns.testEmails" }}" :disabled="isNew" @blur="$el.value !== '' && $el.closest('ot-taginput').add($el.value)" autofocus /></ot-taginput>
									<small data-hint>{{ .L.T "campaigns.sendTestHelp" }}</small>
								</label>
								<div class="hstack justify-end">
									<button type="button" data-variant="primary" @click="onTest" :disabled="isNew || isLoading('campaigns.test')" :aria-busy="isLoading('campaigns.test')" data-spinner="small">{{ Icon "mail" }} {{ .L.T "campaigns.send" }}</button>
								</div>
							</div>
						</ot-dropdown>
					{{- end }}
				</div>
				<div class="col-6 col-end hstack justify-end">
					<button type="button" class="outline" autofocus @click="$refs.previewDialog.close()">{{ .L.T "globals.buttons.close" }}</button>
				</div>
			</div>
		</footer>
	</div>
</dialog>
{{- end }}
